name: hit_devtools_extension
description: DevTools extension for package:hit — inspect hit areas and scopes.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  devtools_app_shared: ^0.5.1
  devtools_extensions: ^0.5.1
  hit:
    path: ../
  two_dimensional_scrollables: ^0.3.3
  vm_service: ^15.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
