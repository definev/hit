name: hit
description: Decouple Flutter layout size from hit-test size, and deliver taps outside parent bounds.
version: 1.2.4
repository: https://github.com/definev/hit
homepage: https://github.com/definev/hit
issue_tracker: https://github.com/definev/hit/issues
topics:
  - flutter
  - widgets
  - gestures
  - hit-testing
screenshots:
  - description: Package banner — expand touch targets without growing layout.
    path: assets/logo.png

environment:
  sdk: ^3.0.0
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=3.0.0 <7.0.0"

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:
