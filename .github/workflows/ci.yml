name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Analyze DevTools extension
        run: |
          flutter pub get --directory hit_devtools_extension
          flutter analyze hit_devtools_extension
      - name: Validate DevTools extension config
        run: |
          flutter pub get --directory hit_devtools_extension
          (cd hit_devtools_extension && dart run devtools_extensions validate --package=..)
